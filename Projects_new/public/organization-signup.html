<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="organization-signup.css">
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Organization Signup | ELAZ</title>

</head>


<body>

    <div class="signup-box">

        <h1>
            ELAZ Health & Environment
        </h1>

        <h2>
            Organization Signup
        </h2>

        <div id="signup-content">


    <p>
        Register your healthcare organization to get started.
    </p>

</div>


        <form id="organization-form">

    <div class="form-group">

        <label for="organization_name">
            Organization Name
        </label>

        <input
            type="text"
            id="organization_name"
            name="organization_name"
            placeholder="Enter organization name"
            required
        >

    </div>


    <div class="form-group">

        <label for="email">
            Organization Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter organization email"
            required
        >

    </div>


    <div class="form-group">

        <label for="phone">
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter phone number"
            required
        >

    </div>


    <div class="form-group">

        <label for="address">
            Organization Address
        </label>

        <input
            type="text"
            id="address"
            name="address"
            placeholder="Enter organization address"
            required
        >

    </div>


    <div class="form-group">

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
        >

    </div>


    <div class="form-group">

        <label for="confirm-password">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Confirm your password"
            required
        >

    </div>


    <button type="submit">
        Create Organization
    </button>

</form>


        <div
            id="success-message"
            style="display: none;"
        >

            <h2>
                Organization created successfully!
            </h2>

            <p>
                Your Organization ID is:
            </p>

            <h2 id="organization-id"></h2>

            <p>
                Please save this ID. You will need it when
                registering doctors under your organization.
            </p>

        </div>


        <p id="error-message"></p>

    </div>


    <script src="organization-signup.js"></script>

</body>

</html>
