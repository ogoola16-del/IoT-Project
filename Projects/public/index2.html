<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration</title>
    <link rel="stylesheet" href="patient.css">
</head>
<body>

<div class="container">

    <h2>Patient Registration</h2>

    <!-- New Patient -->
<div class="card">

    <h3>New Patient</h3>

    <div class="form-row">
        <div class="form-group">
            <label>Name</label>
            <input type="text" id="patient-name" placeholder="Enter patient's name">
        </div>

        <div class="form-group">
            <label>Age</label>
            <input type="number" id="patient-age" placeholder="Enter age" min="0" max="150" step="1" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Gender</label>
            <select id="patient-gender" required>
        <option value="" selected disabled>Select gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>
        </div>

        <div class="form-group">
            <label>Hospital Card ID</label>
            <input type="text" id="patient-card-id" placeholder="Enter Hospital Card ID">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Weight(kg)</label>
            <input type="text" id="patient-weight" placeholder="Enter weight">
        </div>

        <div class="form-group">
            <label>Height(cm)</label>
            <input type="text" id="patient-height" placeholder="Enter height">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Blood Pressure</label>
            <input type="text" id="patient-bp" placeholder="Enter blood pressure">
        </div>

        <!-- Empty space so Blood Pressure stays aligned -->
        <div class="form-group"></div>
    </div>

    <button id="new-patient-btn">
        Start Monitoring
    </button>

</div>

    <div class="divider">OR</div>

    <!-- Returning Patient -->
    <div class="card">

        <h3>Returning Patient</h3>

        <label>Patient ID</label>
        <input type="text" id="patient-id" placeholder="e.g. P0001">

        <button id="load-patient-btn">
            Load Patient
        </button>

    </div>

</div>

<script src="patient.js"></script>

</body>
</html>
